<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IG GC Bot</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:20px}
h1{color:#ff69b4;margin-bottom:4px}
p.sub{color:#888;font-size:13px;margin-top:0;margin-bottom:20px}
input{width:100%;padding:11px;background:#151515;border:1px solid #333;color:#eee;border-radius:8px;margin:6px 0;font-size:14px}
button{width:100%;padding:13px;background:#ff69b4;color:#000;border:none;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
button:disabled{opacity:.5}
#status{margin-top:16px;padding:12px;border-radius:8px;background:#111;font-size:13px;display:none}
#status.show{display:block}
.ok{color:#4ade80;border:1px solid #4ade80}
.err{color:#f87171;border:1px solid #f87171}
label{font-size:12px;color:#aaa;display:block;margin-top:14px;margin-bottom:2px;font-weight:600}
</style>
</head>
<body>
<h1>IG GC Bot</h1>
<p class="sub">Instagram group bot — 1 GC, max 5 admins</p>

<label>Dashboard Password</label>
<input id="pass" type="password" placeholder="DASH_PASSWORD">

<label>Instagram Username (Bot Account)</label>
<input id="username" placeholder="e.g. eren_ye4gerrr">

<label>Instagram Password</label>
<input id="igPassword" type="password" placeholder="Instagram Password">

<label>Group Thread ID</label>
<input id="threadId" placeholder="e.g. 1158412246605899">

<label>Admin usernames (comma separated, max 5)</label>
<input id="admins" placeholder="admin1, admin2">

<button id="go">Start Bot</button>
<div id="status"></div>

<script>
document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  const s = document.getElementById('status');
  btn.disabled = true;
  s.textContent = 'Starting... (May take 30s)';
  s.className = 'show';
  try {
    const r = await fetch('/api/start', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        password: document.getElementById('pass').value,
        username: document.getElementById('username').value,
        igPassword: document.getElementById('igPassword').value,
        threadId: document.getElementById('threadId').value,
        adminList: document.getElementById('admins').value
      })
    });
    const j = await r.json();
    if (r.ok) {
      s.textContent = '✅ Running as @' + j.me;
      s.className = 'show ok';
    } else {
      s.textContent = '❌ ' + j.error;
      s.className = 'show err';
      btn.disabled = false;
    }
  } catch(e) {
    s.textContent = '❌ ' + e.message;
    s.className = 'show err';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
